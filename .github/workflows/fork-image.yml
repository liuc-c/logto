name: Fork OSS image

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepack
      - name: Type checks
        run: pnpm --filter @logto/schemas --filter @logto/core --filter @logto/console --filter @logto/integration-tests check
      - name: Lint
        run: pnpm --filter @logto/schemas --filter @logto/phrases --filter @logto/core --filter @logto/console --filter @logto/integration-tests lint
      - name: Relevant backend tests
        run: pnpm --filter @logto/core test --runInBand demo-apps logto-config sign-in-experience koa-auth
      - name: Relevant console tests
        run: pnpm --filter @logto/console test --runInBand use-branding-entitlements parser DemoApps
      - name: Build integration tests and install browser
        run: |
          pnpm --filter @logto/integration-tests build
          pnpm --filter @logto/integration-tests exec puppeteer browsers install chrome --install-deps
      - uses: docker/setup-buildx-action@v3
      - name: Build the upstream production Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: logto:acceptance
          cache-from: type=gha,scope=fork-amd64
          cache-to: type=gha,scope=fork-amd64,mode=max
      - name: Verify production container against PostgreSQL 18, including restart
        run: .scripts/fork/validate-container.sh logto:acceptance
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: container-test-logs
          path: logs/fork-container
          retention-days: 7

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name and version
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/logto" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./packages/core/package.json").version')-fork.${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.description=Logto OSS with tenant demo controls and optional login branding
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep commit tags immutable
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" > /tmp/existing-image.txt 2>/dev/null; then
            echo "digest=$(awk '$1 == "Digest:" { print $2; exit }' /tmp/existing-image.txt)" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish verified source
        id: publish
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fork-amd64
          provenance: mode=min
          sbom: true
      - name: Report digest and anonymous access
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.existing.outputs.digest || steps.publish.outputs.digest }}
        run: |
          echo "Published: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
          if docker pull "$IMAGE@$DIGEST"; then
            echo 'Anonymous pull verified.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::First publication may be private. Set the GHCR package visibility to Public, then rerun this workflow to verify anonymous pulling.'
            echo 'Public access NOT verified. Set the package visibility to Public and rerun.' >> "$GITHUB_STEP_SUMMARY"
          fi
