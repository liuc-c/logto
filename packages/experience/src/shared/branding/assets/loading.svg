<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" class="liuovo-loading" role="img" aria-label="加载中"><style>.liuovo-loading *{transform-box:view-box}.liuovo-loading .sym{transform-origin:32px 32px;animation:liuovo-loading-spin 1.2s cubic-bezier(.65,0,.35,1) infinite}.liuovo-loading .ring{animation:liuovo-loading-l 1.2s ease-in-out infinite}.liuovo-loading .disc{animation:liuovo-loading-r 1.2s ease-in-out infinite}@keyframes liuovo-loading-spin{to{transform:rotate(360deg)}}@keyframes liuovo-loading-l{50%{transform:translateX(-1.86px)}}@keyframes liuovo-loading-r{50%{transform:translateX(1.86px)}}@media (prefers-reduced-motion:reduce){.liuovo-loading *{animation:none!important}.liuovo-loading .badge{animation:liuovo-loading-calm 1.6s ease-in-out infinite!important}}@keyframes liuovo-loading-calm{50%{opacity:.45}}</style><defs><mask id="liuovo-loading-mask" maskUnits="userSpaceOnUse" x="6" y="6" width="52" height="52"><rect x="6" y="6" width="52" height="52" fill="#fff"/><g class="sym"><circle id="liuovo-loading-ring" class="ring" cx="27.04" cy="32" r="9.92" fill="none" stroke="#000" stroke-width="2.48"/><circle id="liuovo-loading-disc" class="disc" cx="36.96" cy="32" r="11.16" fill="#000"/><g clip-path="url(#liuovo-loading-clip)"><circle class="ring" cx="27.04" cy="32" r="9.92" fill="none" stroke="#fff" stroke-width="2.48"/></g></g></mask><clipPath id="liuovo-loading-clip"><circle class="disc" cx="36.96" cy="32" r="11.16"/></clipPath></defs><g id="liuovo-loading-badge" class="badge"><circle cx="32" cy="32" r="26" fill="currentColor" mask="url(#liuovo-loading-mask)"/></g></svg>
